[package]
name = "converter-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
# Sibling checkout for now: clone converter-core next to this repo. Switch to a git dependency once core is tagged.
converter-core = { path = "../core" }
gpui = "0.2.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

# gpui 0.2.2 pulls `xattr 0.2.3`, which no longer compiles on Linux against recent `libc`
# (ENOATTR was removed there). The vendored copy maps it to ENODATA; nothing else changed.
[patch.crates-io]
xattr = { path = "vendor/xattr" }

[target.'cfg(target_os = "linux")'.dependencies]
# XRecord = read global pointer/keyboard events without a window (pure Rust, no extra system libraries).
x11rb = { version = "0.13", default-features = false, features = ["record"] }
# System tray via the StatusNotifierItem D-Bus protocol (pure Rust; works on KDE, GNOME with the AppIndicator
# extension, Cinnamon, XFCE, ...). Windows/macOS will use `tray-icon` instead.
ksni = "0.3"
