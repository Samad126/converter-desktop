[package]
name = "converter-desktop"
version = "0.2.3"
edition = "2021"
license = "MIT"

[dependencies]
# Sibling checkout for now: clone converter-core next to this repo. Switch to a git dependency once core is tagged.
converter-core = { path = "../core" }
gpui = "0.2.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

# gpui 0.2.2 pulls `zed-xim`, whose input-method handler panics on a non-UTF-8 commit string (patched to fall
# back to Latin-1), and `xattr 0.2.3`, which no longer compiles on Linux against recent `libc`
# (ENOATTR was removed there). The vendored copy maps it to ENODATA; nothing else changed.
# Windows and macOS: tray icon and the global Ctrl/Option+drag listener. Compile-checked in CI; not yet exercised on real
# hardware (see README), so the ring is off by default there.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = "0.26"
rdev = "0.5"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
raw-window-handle = "0.6"

[dev-dependencies]
xim = { package = "zed-xim", version = "0.4.0-zed" }

[patch.crates-io]
xattr = { path = "vendor/xattr" }
zed-xim = { path = "vendor/zed-xim" }

[target.'cfg(target_os = "linux")'.dependencies]
# XRecord = read global pointer/keyboard events without a window (pure Rust, no extra system libraries).
x11rb = { version = "0.13", default-features = false, features = ["record"] }
# System tray via the StatusNotifierItem D-Bus protocol (pure Rust; works on KDE, GNOME with the AppIndicator
# extension, Cinnamon, XFCE, ...). Windows/macOS will use `tray-icon` instead.
ksni = "0.3"
