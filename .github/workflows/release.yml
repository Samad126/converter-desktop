name: Release build
on:
  push: { tags: ["v*"] }
  workflow_dispatch:          # manual run: builds the packages and uploads them as artifacts, publishes nothing
permissions:
  contents: write
jobs:
  package:
    name: package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,   name: converter-desktop-linux-x86_64,  bin: target/release/converter-desktop,     kind: tar.gz }
          - { os: windows-latest, name: converter-desktop-windows-x86_64, bin: target/release/converter-desktop.exe, kind: zip }
          - { os: macos-latest,   name: converter-desktop-macos-arm64,   bin: target/release/converter-desktop,     kind: app }
          # Intel Macs (incl. Hackintosh): cross-compiled on the Apple Silicon runner.
          - { os: macos-latest,   name: converter-desktop-macos-x86_64,  bin: target/x86_64-apple-darwin/release/converter-desktop, kind: app, target: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@v4
        with: { path: desktop }
      - uses: actions/checkout@v4
        with: { repository: Samad126/converter-core, path: core }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: desktop, key: "${{ matrix.name }}" }
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig-dev \
            libfreetype-dev libwayland-dev libvulkan-dev libx11-xcb-dev libxcb-xfixes0-dev libxcb-shape0-dev libasound2-dev
      - run: cargo build --release ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
        working-directory: desktop
      - name: Package
        shell: bash
        working-directory: desktop
        run: ./packaging.sh "${{ matrix.bin }}" "${{ matrix.name }}" "${{ matrix.kind }}"
      - name: Windows installer (per-user setup.exe) and silent install check
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: desktop
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) { choco install nsis -y --no-progress; $env:PATH += ";C:\Program Files (x86)\NSIS" }
          $ver = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches.Groups[1].Value
          $setup = "$PWD\dist\${{ matrix.name }}-setup.exe"
          makensis /DVERSION=$ver "/DSRC=$PWD\dist\${{ matrix.name }}" "/DOUT=$setup" windows\installer.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed" }
          # Silent install into a scratch dir, check the files, uninstall, check it is gone.
          $dir = "$env:RUNNER_TEMP\conv-install"
          Start-Process -FilePath $setup -ArgumentList "/S","/D=$dir" -Wait
          if (-not (Test-Path "$dir\converter-desktop.exe")) { throw "exe missing after install" }
          if (-not (Test-Path "$dir\scripts\pdf_engine.py")) { throw "scripts missing after install" }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Converter.lnk")) { throw "start menu shortcut missing" }
          Start-Process -FilePath "$dir\Uninstall.exe" -ArgumentList "/S" -Wait
          Start-Sleep -Seconds 3
          if (Test-Path "$dir\converter-desktop.exe") { throw "exe still present after uninstall" }
          Get-Item $setup | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: desktop/dist/${{ matrix.name }}*.*
          if-no-files-found: error
      - name: Attach to the GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/${{ matrix.name }}*.*
          prerelease: false
